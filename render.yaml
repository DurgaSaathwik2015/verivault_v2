
# TrustVault - Render Blueprint
services:
  - type: web
    name: verivault
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT run:app

    healthCheckPath: /health

    envVars:
      # Secure, automatically generated application secret
      - key: SECRET_KEY
        generateValue: true

      # HTTPS-only session cookies
      - key: COOKIE_SECURE
        value: "true"

      # Trust Render's reverse proxy
      - key: TRUST_PROXY
        value: "1"

      # Disable publicly documented demo accounts
      - key: SEED_DEMO
        value: "0"
